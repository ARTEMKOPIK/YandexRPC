name: Auto-Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label new issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            
            // Автоматическая расстановка лейблов по ключевым словам
            const labels = [];
            const body = (issue.body + ' ' + issue.title).toLowerCase();
            
            if (body.includes('баг') || body.includes('ошибка') || body.includes('bug') || body.includes('error')) {
              labels.push('bug');
            }
            if (body.includes('фича') || body.includes('предложение') || body.includes('feature')) {
              labels.push('enhancement');
            }
            if (body.includes('вопрос') || body.includes('help') || body.includes('как')) {
              labels.push('question');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
            
            // Автоматический ответ
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `👋 Спасибо за обращение! \n\nЭто сообщение создано автоматически. Мы рассмотрим ваш вопрос в ближайшее время.\n\n---\n*Auto-generated response by GitHub Actions*`
            });
